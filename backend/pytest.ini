[pytest]
# Scope collection to the real test suite. `test_full_project_apis.py` and
# `test_member2_apis.py` at the backend/ root are leftovers from the team
# merge (superseded by backend/app/ + backend/tests/) and still use a
# package-relative import (`from backend.main import app`) that doesn't
# resolve when pytest runs from inside backend/. They're safe to delete;
# until then this keeps them out of collection instead of erroring on them.
testpaths = tests
